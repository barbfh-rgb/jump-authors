<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jump & Co Author Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow working column. A checklist of seven leads to one item at a time, then the finished pack. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#141A14; --muted:#4A5A56; --line:#D3DEDB;
  --accent:#004B43; --on-accent:#FFFFFF; --mark:#CC3366; --ok:#0A4A2A; --soft:#FCEEF4;
  --display:Georgia,"Times New Roman",serif;
  --body:Inter,"Segoe UI",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1F1C; --surface:#11302B; --ink:#EEF4F2; --muted:#A5BBB6; --line:#27483F;
    --accent:#F8B0CD; --on-accent:#0A1F1C; --mark:#FF8FB5; --ok:#8FD9C4; --soft:#173A34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1F1C; --surface:#11302B; --ink:#EEF4F2; --muted:#A5BBB6; --line:#27483F;
  --accent:#F8B0CD; --on-accent:#0A1F1C; --mark:#FF8FB5; --ok:#8FD9C4; --soft:#173A34;
  color-scheme:dark;
}
.brand b{display:block;font-family:var(--body);font-weight:600;font-size:.7rem;letter-spacing:.28em;color:var(--mark)}
.panel{background:var(--soft)!important;border-color:transparent!important}
*{box-sizing:border-box}
.logo{background:#FFFFFF;border-radius:6px;padding:8px 10px;align-self:flex-start;max-width:22rem}
.logo img{display:block;width:100%;height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:44rem;margin:0 auto;padding-inline:18px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1;color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:2rem}
h2{font-size:1.6rem}
h4{font-size:1.2rem}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.tight{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.rowbtn{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:none;border:0;padding:14px 4px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.rowbtn:hover .rname{text-decoration:underline}
.rname{font-family:var(--display);font-size:1.2rem;min-width:0}
.rnum{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.status{font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.prog{color:var(--mark);border-color:var(--mark)}
.status.done{color:var(--ok);border-color:var(--ok)}
label{display:block;font-size:.95rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=url],input[type=password],textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
textarea{min-height:15rem;resize:vertical;line-height:1.5}
textarea.small{min-height:5rem}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;border-radius:50px;padding:10px 20px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--muted)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:1rem;margin:0}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--accent);flex:none}
.template{background:var(--surface);border-radius:5px;padding:14px;white-space:pre-wrap;font-size:.97rem}
.entry{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.entry .bar{justify-content:space-between}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:12px}
.two>div{min-width:0}
.charm{font-family:var(--display);font-size:1.5rem}
a{color:var(--accent)}
.note{font-size:.92rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent)}
#pack{min-height:22rem;font-size:.95rem}
</style>

</head>

<script>
(function(){
var HASH="abce8a3353a47bd80ab09eae5ebdfffbddafb73c8002b0c77175b2b22580f2d0";
var KEY="jumpco-author-guide-v1", UNLOCK="jumpco-author-guide-open";
var app=document.getElementById("app");
var storageOK=true;
function load(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){storageOK=false}}
function blank(){return {name:"",title:"",cover:"",synopsis:"",blurb:"",ch1:"",ch2:"",web:"",news:"",
  breakdown:[{a:"",b:"",c:""}],socials:[{a:"",b:"",c:""}],reviewers:[{a:"",b:"",c:"",d:""}],
  noSocials:false,noReviewers:false,done:{},checks:[false,false,false]}}
var S=blank();
try{var raw=load(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function persist(){save(KEY,JSON.stringify(S))}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

var ITEMS=[
 {n:1,name:"Cover letter"},{n:2,name:"Synopsis"},{n:3,name:"Chapter or section breakdown"},
 {n:4,name:"Book blurb"},{n:5,name:"First two chapters or sections"},{n:6,name:"Social media profiles and links"},
 {n:7,name:"Potential reviewers"}];
var LISTS={
 3:{key:"breakdown",add:"Add a chapter or section",one:"Chapter or section",f:[["a","Working title"],["b","Brief summary",1],["c","Purpose in the book",1]]},
 6:{key:"socials",add:"Add a profile",one:"Profile",f:[["a","Platform"],["b","Link or handle"],["c","Audience or topic note (optional)"]]},
 7:{key:"reviewers",add:"Add a reviewer",one:"Reviewer",f:[["a","Name or outlet"],["b","Why they are suitable",1],["c","Public contact route, if known"],["d","Existing connection"]]}
};
function rowsFilled(list){return list.some(function(r){for(var k in r)if(String(r[k]).trim())return true;return false})}
function hasContent(n){
  if(n===1)return !!S.cover.trim(); if(n===2)return !!S.synopsis.trim(); if(n===4)return !!S.blurb.trim();
  if(n===3)return rowsFilled(S.breakdown); if(n===5)return !!(S.ch1.trim()||S.ch2.trim());
  if(n===6)return S.noSocials||rowsFilled(S.socials)||!!(S.web.trim()||S.news.trim());
  if(n===7)return S.noReviewers||rowsFilled(S.reviewers); return false}
function status(n){return S.done[n]?["Completed","done"]:hasContent(n)?["In progress","prog"]:["Not started",""]}
function pill(n){var s=status(n);return '<span class="status '+s[1]+'">'+s[0]+'</span>'}

var GUIDE={
1:'<p>A brief introduction to you and your book. It is separate from the synopsis.</p>'+
  '<div class="tight"><p>Include:</p><ul class="plain"><li>Your name</li><li>The working title</li><li>The type of book</li><li>What it is about</li><li>Who it is for</li><li>Your connection to the subject</li><li>How far the manuscript has got</li><li>What you are sending with it</li></ul></div>'+
  '<div class="tight"><p>A structure to follow:</p><div class="template">Dear Jump &amp; Co Publishing team,\n\nMy name is [name]. I am submitting [working title], a [type] about [subject]. It is for [reader] and explores [brief explanation]. My connection to the subject is [relevant experience]. The manuscript is [status]. I have included [actual materials].\n\nBest wishes,\n[name and preferred contact details]</div></div>'+
  '<p>List only the materials you are including. State only experience and qualifications you hold.</p>',
2:'<p>The whole book, including the ending. This is not sales copy.</p>'+
  '<ul class="plain"><li>Memoir: the key events and the ending or where you are today. It does not need a triumphant recovery.</li><li>Nonfiction: the scope, the main ideas and how they progress.</li></ul>'+
  '<div class="tight"><p>Begin with notes on each of these, then shape them into the synopsis:</p><ul class="plain"><li>Subject</li><li>Reader</li><li>Starting point</li><li>Events or ideas</li><li>How it develops</li><li>Conclusion</li><li>Your perspective</li></ul></div>',
3:'<p>More informative than a contents list. Add one entry for each chapter or section, in order.</p>'+
  '<ul class="plain"><li>Memoir: organise by chronology or by themes.</li><li>Nonfiction: organise by the journey the reader takes.</li></ul>'+
  '<p>Use your actual material. Mark anything undecided as provisional.</p>',
4:'<p>Written for the reader and different from the synopsis. Invite interest without summarising every chapter or section.</p>'+
  '<div class="tight"><p>Cover:</p><ul class="plain"><li>The opening situation or question</li><li>What the book explores</li><li>Your perspective</li><li>What the reader gains</li><li>A closing invitation</li></ul></div>'+
  '<p>Leave out invented endorsements, bestseller claims and promises of healing.</p>',
5:'<p>Your first two chapters or sections, written by you, in order, labelled and readable.</p>'+
  '<ul class="plain"><li>Keep them in your preferred editing place.</li><li>Create a sharing link that lets anyone with the link view them.</li><li>Copy the link and paste it below.</li></ul>'+
  '<details><summary>Manuscript layout suggestions</summary><div class="stack" style="margin-top:10px"><p>These are suggestions and not house rules.</p><ul class="plain"><li>A title and author page</li><li>A contents page</li><li>Consistent headings</li><li>Each chapter or section beginning on a new page</li><li>A readable font and spacing</li><li>Page numbers</li><li>Images and tables labelled with their sources</li></ul><p>You do not need a cover, an ISBN, a trim size or a print-ready PDF.</p></div></details>',
6:'<p>Your existing public profiles only. There is no minimum number of followers.</p><p>Never enter passwords or private account figures.</p>',
7:'<p>People or outlets who might review your book. Begin with your own suggestions.</p>'+
  '<ul class="plain"><li>These are potential reviewers. Nobody needs to have agreed.</li><li>Leave out any editor you have paid to work on the manuscript.</li></ul>'
};

function field(id,label,key,type,ph){
  return '<div><label for="'+id+'">'+label+'</label><input type="'+(type||"text")+'" id="'+id+'" data-k="'+key+'" value="'+esc(S[key])+'"'+(ph?' placeholder="'+ph+'"':'')+'></div>'}
function area(id,label,key){
  return '<div><label for="'+id+'">'+label+'</label><textarea id="'+id+'" data-k="'+key+'">'+esc(S[key])+'</textarea></div>'}
function listHTML(n){
  var L=LISTS[n],rows=S[L.key],h='';
  rows.forEach(function(r,i){
    h+='<div class="entry"><div class="bar"><span class="muted">'+L.one+' '+(i+1)+'</span>'+
       (rows.length>1?'<button class="btn quiet" data-del="'+L.key+'" data-i="'+i+'">Remove</button>':'')+'</div>';
    L.f.forEach(function(f){
      var id=L.key+'-'+i+'-'+f[0];
      h+='<div><label for="'+id+'">'+f[1]+'</label>'+(f[2]
        ?'<textarea class="small" id="'+id+'" data-l="'+L.key+'" data-i="'+i+'" data-f="'+f[0]+'">'+esc(r[f[0]])+'</textarea>'
        :'<input type="text" id="'+id+'" data-l="'+L.key+'" data-i="'+i+'" data-f="'+f[0]+'" value="'+esc(r[f[0]])+'">')+'</div>'});
    h+='</div>'});
  return h+'<div><button class="btn ghost" data-add="'+L.key+'">'+L.add+'</button></div>'}
function tick(id,key,text,on){return '<label class="check" for="'+id+'"><input type="checkbox" id="'+id+'" data-c="'+key+'"'+(on?' checked':'')+'><span>'+text+'</span></label>'}

function body(n){
  if(n===1)return area("f-cover","Your cover letter","cover");
  if(n===2)return area("f-synopsis","Your synopsis","synopsis");
  if(n===4)return area("f-blurb","Your blurb","blurb");
  if(n===3)return listHTML(3);
  if(n===5)return field("f-ch1","Link to your first chapter or section","ch1","url","https://")+
                  field("f-ch2","Link to your second chapter or section","ch2","url","https://")+
                  '<p class="note">If both are in one document, paste the same link in both boxes.</p>';
  if(n===6)return tick("f-nosoc","noSocials","I have no current social media profiles",S.noSocials)+listHTML(6)+
                  '<div class="two">'+field("f-web","Website (optional)","web")+field("f-news","Newsletter (optional)","news")+'</div>';
  if(n===7)return tick("f-norev","noReviewers","Potential reviewers not yet identified",S.noReviewers)+listHTML(7);
}

var view="home";
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  if(view==="home")return home();
  if(view==="pack")return pack();
  item(view);
}
function home(){
  var h='<div class="stack"><h1>Author Guide</h1>'+
   '<p>Prepare your book submission one item at a time. You do not need to have everything ready to begin.</p>'+
   '<p>This guide is here to help and guide with what is needed. It does not write the words for you.</p></div>'+
   '<div class="two">'+field("f-name","Your name","name")+field("f-title","Working title of your book","title")+'</div>'+
   '<ul class="list">';
  ITEMS.forEach(function(it){h+='<li><button class="rowbtn" data-go="'+it.n+'"><span class="rname"><span class="rnum">'+it.n+'.</span>'+it.name+'</span>'+pill(it.n)+'</button></li>'});
  h+='</ul><div><button class="btn" data-go="pack">See my submission pack</button></div>'+
   '<div class="panel stack"><h4>Before you begin</h4><ul class="plain">'+
   '<li>Use a laptop, a phone or an iPad.</li>'+
   '<li>Choose one device and one browser and use the same one every time. Your work stays on the device you typed it on and does not appear on another.</li>'+
   '<li>Your work saves as you type.</li>'+
   '<li>Complete the seven items in any order. Tick "This item is completed" when each one is finished.</li>'+
   '<li>Nobody at Jump &amp; Co can see your work until you send it.</li>'+
   '<li>To keep a backup, open your submission pack, copy it and paste it into Google Docs. Do this each time you finish working.</li>'+
   '<li>If anything becomes large, copy and paste it into your preferred place. Google Docs works well.</li>'+
   '<li>Completing all seven items does not guarantee publication.</li></ul>'+
   '<h4>About Jump &amp; Co</h4>'+
   '<p>Jump &amp; Co is an independent publishing company. Some authors who are invited to publish with us will be asked to contribute to the cost of publishing their book.</p>'+
   (storageOK?'':'<p style="color:var(--mark)">This browser is not saving your work. Copy anything you write into Google Docs before you close the page.</p>')+
   '</div>'+
   '<div id="clearbox"><button class="btn quiet" data-clear="ask">Clear everything and begin again</button></div>';
  app.innerHTML=h;
}
function item(n){
  var it=ITEMS[n-1];
  app.innerHTML='<div><button class="btn quiet" data-go="home">All seven items</button></div>'+
   '<div class="bar"><h2><span class="rnum">'+n+'.</span>'+it.name+'</h2><span id="pill">'+pill(n)+'</span></div>'+
   '<div class="panel stack">'+GUIDE[n]+'</div>'+
   '<div class="stack">'+body(n)+'</div>'+
   tick("f-done","done","This item is completed",!!S.done[n])+
   '<div class="bar">'+(n>1?'<button class="btn ghost" data-go="'+(n-1)+'">Back</button>':'<span></span>')+
   (n<7?'<button class="btn" data-go="'+(n+1)+'">Next item</button>':'<button class="btn" data-go="pack">See my submission pack</button>')+'</div>';
}
function rowsText(n){
  var L=LISTS[n],out=[];
  S[L.key].forEach(function(r,i){
    var has=false,b=[];L.f.forEach(function(f){var v=String(r[f[0]]).trim();if(v){has=true;b.push(f[1].replace(" (optional)","")+": "+v)}});
    if(has)out.push((n===3?(out.length+1)+". ":"")+b.join("\n"))});
  return out.join("\n\n")}
function packText(){
  var miss="[Not yet completed]",t=[];
  t.push("SUBMISSION TO JUMP & CO PUBLISHING");
  t.push("Author: "+(S.name.trim()||miss)+"\nWorking title: "+(S.title.trim()||miss));
  t.push("1. COVER LETTER\n\n"+(S.cover.trim()||miss));
  t.push("2. SYNOPSIS\n\n"+(S.synopsis.trim()||miss));
  t.push("3. CHAPTER OR SECTION BREAKDOWN\n\n"+(rowsText(3)||miss));
  t.push("4. BOOK BLURB\n\n"+(S.blurb.trim()||miss));
  t.push("5. FIRST TWO CHAPTERS OR SECTIONS\n\nFirst: "+(S.ch1.trim()||miss)+"\nSecond: "+(S.ch2.trim()||miss));
  var soc=S.noSocials?"No current social media profiles":rowsText(6);
  var extra=[];if(S.web.trim())extra.push("Website: "+S.web.trim());if(S.news.trim())extra.push("Newsletter: "+S.news.trim());
  t.push("6. SOCIAL MEDIA PROFILES AND LINKS\n\n"+([soc,extra.join("\n")].filter(Boolean).join("\n\n")||miss));
  t.push("7. POTENTIAL REVIEWERS\n\n"+(S.noReviewers?"Potential reviewers not yet identified":(rowsText(7)||miss)));
  return t.join("\n\n\n")}
function pack(){
  var left=ITEMS.filter(function(it){return !S.done[it.n]});
  var h='<div><button class="btn quiet" data-go="home">All seven items</button></div><h2>Your submission pack</h2>';
  if(left.length){h+='<div class="panel stack"><p>These items are not yet marked as completed:</p><ul class="plain">';
    left.forEach(function(it){h+='<li><a href="#" data-go="'+it.n+'">'+it.n+'. '+it.name+'</a></li>'});h+='</ul></div>'}
  h+='<div class="stack"><p class="charm">Check it. Check it again. Third time is a charm.</p>'+
   tick("f-c0","check0","First check",S.checks[0])+tick("f-c1","check1","Second check",S.checks[1])+tick("f-c2","check2","Third check",S.checks[2])+'</div>'+
   '<div><label for="pack">Everything you have entered</label><textarea id="pack" readonly>'+esc(packText())+'</textarea></div>'+
   '<div class="bar"><button class="btn" id="copy">Copy my pack</button><span id="copied" class="muted" role="status"></span></div>'+
   '<div class="panel stack"><h4>Sending it</h4><ul class="plain"><li>Open a new Google Doc.</li><li>Paste your pack into it.</li><li>Read it through once more there.</li>'+
   '<li>Email it to barbara@jumpcopublishing.com.</li>'+
   '<li>You can read more about Jump &amp; Co at <a href="https://jumpcopublishing.com/" target="_blank" rel="noopener">jumpcopublishing.com</a>.</li></ul>'+
   '<p class="note">To change anything, go back to the item, edit it and return here.</p></div>';
  app.innerHTML=h;
}
function refreshPill(){var p=document.getElementById("pill");if(p&&typeof view==="number")p.innerHTML=pill(view)}

app.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;persist();refreshPill()}
  else if(t.dataset.l){S[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value;persist();refreshPill()}
});
app.addEventListener("change",function(e){
  var c=e.target.dataset.c;if(!c)return;var on=e.target.checked;
  if(c==="done"){S.done[view]=on}
  else if(c.indexOf("check")===0){S.checks[+c.slice(5)]=on}
  else{S[c]=on}
  persist();refreshPill();
});
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-add],[data-del],[data-clear],#copy,#unlock");if(!t)return;
  if(t.dataset.go){e.preventDefault();var g=t.dataset.go;go(g==="home"||g==="pack"?g:+g);return}
  if(t.dataset.add){var L;for(var n in LISTS)if(LISTS[n].key===t.dataset.add)L=LISTS[n];
    var r={};L.f.forEach(function(f){r[f[0]]=""});S[L.key].push(r);persist();render();return}
  if(t.dataset.del){S[t.dataset.del].splice(+t.dataset.i,1);persist();render();return}
  if(t.dataset.clear==="ask"){document.getElementById("clearbox").innerHTML='<div class="panel stack"><p>This removes everything you have entered on this device. It cannot be undone.</p><div class="bar"><button class="btn quiet" data-clear="no">Keep my work</button><button class="btn" data-clear="yes">Clear everything</button></div></div>';return}
  if(t.dataset.clear==="no"){render();return}
  if(t.dataset.clear==="yes"){S=blank();persist();render();return}
  if(t.id==="copy"){
    var ta=document.getElementById("pack"),msg=document.getElementById("copied");
    function fallback(){ta.focus();ta.select();msg.textContent="Your pack is selected. Press Ctrl and C, or Cmd and C on a Mac, to copy it."}
    try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Copied. Paste it into Google Docs."},fallback)}catch(err){fallback()}
  }
});

function lock(msg){
  app.innerHTML='<div class="stack"><h1>Author Guide</h1><p>Enter the passcode Jump &amp; Co gave you.</p></div>'+
   '<form id="gate" class="stack" style="max-width:22rem"><div><label for="pc">Passcode</label><input type="password" id="pc" autocomplete="off"></div>'+
   '<div><button class="btn" type="submit">Open the guide</button></div><p id="gmsg" role="alert" style="color:var(--mark)">'+(msg||"")+'</p></form>';
  document.getElementById("gate").addEventListener("submit",function(e){
    e.preventDefault();
    var v=document.getElementById("pc").value.trim().toLowerCase();
    crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)).then(function(buf){
      var hex=Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
      if(hex===HASH){save(UNLOCK,"1");render()}
      else{document.getElementById("gmsg").textContent="That passcode is not right. Check it and enter it again."}
    },function(){document.getElementById("gmsg").textContent="This browser could not check the passcode. Open the guide in a different browser."});
  });
}
if(load(UNLOCK)==="1")render();else lock();
})();
</script>

</body>
</html>
